<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<meta name="theme-color" content="#1c1410">
<title>Biblioteca</title>
<style>
:root,[data-theme=madeira]{--bg:#1c1410;--card:#2a1f18;--paper:#f4ead8;--accent:#c9954c;--onacc:#1c1410;--muted:#a89880;--line:#3d2f24;--wall:#150e0a;--pl1:#7a5230;--pl2:#4a3220}
[data-theme=classica]{--bg:#14231c;--card:#1d3328;--paper:#efe6cf;--accent:#d4af5a;--onacc:#14231c;--muted:#9fb3a3;--line:#2c4739;--wall:#0d1812;--pl1:#6b3b24;--pl2:#3f2015}
[data-theme=minimal]{--bg:#161616;--card:#222;--paper:#ececec;--accent:#d9d9d9;--onacc:#161616;--muted:#8a8a8a;--line:#2e2e2e;--wall:#101010;--pl1:#3a3a3a;--pl2:#2a2a2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* Cabeçalho */
header.top{padding:calc(env(safe-area-inset-top) + 16px) 18px 10px;display:flex;align-items:center;justify-content:space-between}
header.top h1{margin:0;font:700 28px Georgia,serif}
.hb{display:flex;gap:8px;align-items:center}
.add{background:var(--accent);color:var(--onacc);font-weight:600;padding:9px 16px;border-radius:20px;font-size:15px}
.look{border:1px solid var(--line);padding:8px 14px;border-radius:20px;font-size:15px}
#scroller{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
.emptymsg{text-align:center;color:var(--muted);margin-top:30vh;line-height:1.6;padding:0 18px}

/* Vista: capas */
.items.capas{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:22px 14px;padding:8px 18px 24px}
.book{position:relative}
.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px 7px 7px 3px;background:var(--card);
  box-shadow:0 6px 14px rgba(0,0,0,.55),inset 4px 0 6px -3px rgba(0,0,0,.5);display:block}
.bar{height:3px;background:var(--line);border-radius:2px;margin:9px 0 5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.t{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p{font-size:11px;color:var(--muted);margin-top:2px}
.more{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:26px}

/* Vista: estante */
.items.estante{display:flex;flex-wrap:wrap;align-items:flex-end;align-content:flex-start;padding:0 12px;min-height:calc(236px * 3);
  background:repeating-linear-gradient(to bottom,var(--wall) 0,var(--wall) 220px,var(--pl1) 220px,var(--pl1) 224px,var(--pl2) 224px,var(--pl2) 236px)}
.sp{height:236px;padding-bottom:16px;display:flex;align-items:flex-end;margin-right:2px}
.spine{position:relative;display:flex;flex-direction:column;align-items:center;padding:26px 0 6px;overflow:hidden;
  border-radius:2px 2px 1px 1px;
  background-image:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,0) 35%,rgba(0,0,0,.28));
  box-shadow:1px 0 2px rgba(0,0,0,.5);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:3px;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.4}
.spine::before{top:8px}
.spine::after{top:15px}
.spine span{flex:1;min-height:0;max-width:100%;writing-mode:vertical-rl;transform:rotate(180deg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 12px Georgia,serif;line-height:1.1;padding-top:6px}
.spine b{font:600 9px -apple-system,sans-serif;margin-top:6px;opacity:.85}

/* Vista: lista */
.row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.row img{width:44px;height:66px;object-fit:cover;border-radius:2px 4px 4px 2px;box-shadow:0 3px 8px rgba(0,0,0,.5);flex:none}
.row .rt{flex:1;min-width:0}
.row .more{position:static;flex:none}

/* Leitor */
#reader{background:#111}
.rtop,.rbot{background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 14px}
.rtop{padding-top:calc(env(safe-area-inset-top) + 10px)}
.rbot{padding-bottom:calc(env(safe-area-inset-bottom) + 10px);gap:10px}
.rtop .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;text-align:center}
.rtop .back{color:var(--accent);font-size:30px;line-height:1;width:30px}
.rtop .pct{font-size:13px;color:var(--muted);min-width:70px;text-align:right;white-space:nowrap}
.ib{font-size:21px;width:32px;color:var(--accent)}
.ib.aa{font:600 16px Georgia,serif}
#stage{flex:1;overflow:auto;background:#111;-webkit-overflow-scrolling:touch}
#pg{position:relative;margin:0 auto;background:#fff}
#canvas{display:block;-webkit-touch-callout:none}
#hl{position:absolute;inset:0;pointer-events:none}
#hl i{position:absolute;border-radius:2px;mix-blend-mode:multiply;opacity:.55}
#hl i[data-n]{box-shadow:inset 0 -2px 0 rgba(0,0,0,.45)}
#pg.dark #hl i{mix-blend-mode:normal;opacity:.4}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;-webkit-user-select:text;user-select:text}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;transform-origin:0% 0%}
.nav{font-size:26px;width:36px;color:var(--accent)}
#slider{flex:1;accent-color:var(--accent)}

/* Barra de seleção */
#seltb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);
  display:none;gap:10px;align-items:center;background:var(--card);padding:8px 14px;border-radius:26px;
  box-shadow:0 6px 20px rgba(0,0,0,.6);z-index:8}
#seltb.on{display:flex}
#seltb .dot{width:30px;height:30px;border-radius:15px;border:2px solid rgba(255,255,255,.4)}
#seltb .nt{padding:0 6px;font-size:15px;color:var(--accent);white-space:nowrap}

/* Menus */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.sheet>div{width:100%;background:var(--card);border-radius:16px 16px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom) + 14px)}
.sheet .opt{display:block;width:100%;padding:15px;font-size:17px;border-bottom:1px solid var(--line)}
.sheet .opt:last-child{border:0;color:var(--muted)}
.sheet .del{color:#e57373}
.sheet h3{margin:10px 2px 0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:6px;margin:8px 0 14px}
.seg button{flex:1;padding:11px 4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);color:var(--paper);
  padding:14px 22px;border-radius:12px;z-index:20;display:none;box-shadow:0 8px 24px rgba(0,0,0,.6);font-size:15px}

/* Painel de leitura */
#rd{background:transparent}
#rd>div{box-shadow:0 -8px 24px rgba(0,0,0,.55)}
.sw{display:flex;gap:10px;margin:8px 2px 10px;align-items:center;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:16px;border:2px solid rgba(255,255,255,.35)}
.sw input{width:44px;height:32px;border:0;background:none;padding:0}
#rd-prev{border-radius:10px;padding:10px 14px;font:16px/1.3 Georgia,serif;margin:0 2px 8px;border:1px solid var(--line)}
.rng{width:100%;accent-color:var(--accent);margin:10px 0 6px}
.chk{display:flex;gap:10px;align-items:center;padding:12px 4px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

/* Lista de anotações */
#annlist{max-height:50vh;overflow:auto;-webkit-overflow-scrolling:touch;margin:6px 0 4px}
.ai{position:relative;padding:12px 40px 12px 4px;border-bottom:1px solid var(--line)}
.ah{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-bottom:5px}
.ah b{color:var(--accent);font-weight:600}
.at{font-size:14px;line-height:1.35;padding-left:8px;border-left:3px solid var(--accent)}
.an{font-size:13px;color:var(--muted);margin:5px 0 0 11px;font-style:italic}
.ax{position:absolute;right:2px;top:8px;width:32px;height:32px;color:var(--muted);font-size:16px}
.empty2{color:var(--muted);text-align:center;padding:26px 10px;line-height:1.5;font-size:14px}
.q{font:15px/1.4 Georgia,serif;padding:8px 4px}
.nn{font-size:14px;color:var(--muted);font-style:italic;padding:0 4px 10px}
</style>
</head>
<body>

<section id="shelf" class="view on">
  <header class="top">
    <h1>Biblioteca</h1>
    <div class="hb">
      <button class="look" id="lookbtn">Opções</button>
      <label class="add">+ PDF<input id="file" type="file" accept="application/pdf" multiple hidden></label>
    </div>
  </header>
  <div id="scroller"><div id="items" class="items"></div></div>
</section>

<section id="reader" class="view">
  <div class="rtop">
    <button class="back" id="back" aria-label="Voltar à estante">‹</button>
    <div class="ttl" id="rtitle"></div>
    <div class="pct" id="rpct"></div>
    <button class="ib aa" id="rdbtn" aria-label="Leitura">Aa</button>
    <button class="ib" id="mk" aria-label="Marcador">☆</button>
    <button class="ib" id="lst" aria-label="Anotações">☰</button>
  </div>
  <div id="stage">
    <div id="pg">
      <canvas id="canvas"></canvas>
      <div id="hl"></div>
      <div id="tl" class="textLayer"></div>
    </div>
  </div>
  <div class="rbot">
    <button class="nav" id="prev">‹</button>
    <input id="slider" type="range" min="1" max="1" value="1">
    <button class="nav" id="next">›</button>
  </div>
</section>

<div id="seltb">
  <button class="dot" data-c="#ffe14d" style="background:#ffe14d" aria-label="Amarelo"></button>
  <button class="dot" data-c="#7ddf64" style="background:#7ddf64" aria-label="Verde"></button>
  <button class="dot" data-c="#6cc4ff" style="background:#6cc4ff" aria-label="Azul"></button>
  <button class="dot" data-c="#ff8fc7" style="background:#ff8fc7" aria-label="Rosa"></button>
  <button class="nt" id="st-note">+ Nota</button>
</div>

<div class="sheet" id="sheet"><div>
  <button class="opt" id="s-ren">Mudar título</button>
  <button class="opt del" id="s-del">Apagar livro</button>
  <button class="opt" id="s-can">Cancelar</button>
</div></div>

<div class="sheet" id="look"><div>
  <h3>Vista</h3>
  <div class="seg" data-k="view">
    <button data-v="capas">Capas</button><button data-v="estante">Estante</button><button data-v="lista">Lista</button>
  </div>
  <h3>Tema</h3>
  <div class="seg" data-k="theme">
    <button data-v="madeira">Madeira</button><button data-v="classica">Clássica</button><button data-v="minimal">Minimal</button>
  </div>
  <h3>Backup</h3>
  <button class="opt" id="b-exp">Exportar backup</button>
  <button class="opt" id="b-imp">Importar backup</button>
  <button class="opt" id="l-ok">Fechar</button>
</div></div>

<div class="sheet" id="rd"><div>
  <h3>Tema de leitura</h3>
  <div class="seg" id="rd-theme">
    <button data-t="dia">Dia</button><button data-t="sepia">Sépia</button><button data-t="noite">Noite</button><button data-t="cor">Cor</button>
  </div>
  <div id="rd-colorbox" style="display:none">
    <div class="sw" id="rd-sw">
      <button data-c="#14392b" style="background:#14392b" aria-label="Verde"></button>
      <button data-c="#101a2e" style="background:#101a2e" aria-label="Azul"></button>
      <button data-c="#2a1b3d" style="background:#2a1b3d" aria-label="Roxo"></button>
      <button data-c="#2b2b2b" style="background:#2b2b2b" aria-label="Cinza"></button>
      <button data-c="#000000" style="background:#000000" aria-label="Preto"></button>
      <button data-c="#f6efdc" style="background:#f6efdc" aria-label="Creme"></button>
      <input type="color" id="rd-bg" aria-label="Outra cor">
    </div>
    <div id="rd-prev">Aa — a letra ajusta-se sozinha.</div>
  </div>
  <h3>Brilho</h3>
  <input class="rng" type="range" id="rd-bri" min="35" max="100" value="100">
  <h3>Luz quente</h3>
  <input class="rng" type="range" id="rd-warm" min="0" max="60" value="0">
  <label class="chk"><input type="checkbox" id="rd-book"> Só para este livro</label>
  <button class="opt" id="rd-ok">Fechar</button>
</div></div>

<div class="sheet" id="ann"><div>
  <h3>Anotações</h3>
  <div id="annlist"></div>
  <button class="opt" id="a-share">Partilhar notas</button>
  <button class="opt" id="a-ok">Fechar</button>
</div></div>

<div class="sheet" id="hs"><div>
  <div id="hstext"></div>
  <button class="opt" id="h-note">Editar nota</button>
  <button class="opt del" id="h-del">Apagar destaque</button>
  <button class="opt" id="h-ok">Fechar</button>
</div></div>

<input id="bfile" type="file" hidden>
<div id="busy"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- Ícone da app ---------- */
(function(){
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,180,180); g.addColorStop(0,'#4a3220'); g.addColorStop(1,'#1c1410');
  x.fillStyle = g; x.fillRect(0,0,180,180);
  x.fillStyle = '#c9954c'; x.fillRect(48,38,84,104);
  x.fillStyle = '#f4ead8'; x.fillRect(58,38,74,104);
  x.fillStyle = '#8a5a2b'; x.fillRect(48,38,10,104);
  x.fillStyle = '#c9954c'; x.fillRect(72,66,46,5); x.fillRect(72,80,46,5); x.fillRect(72,94,30,5);
  const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
  document.head.appendChild(l);
})();

/* ---------- Offline (service worker) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- Preferências de aspeto ---------- */
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
let view = ls.get('bib.view') || 'estante';
let theme = ls.get('bib.theme') || 'madeira';
const THEME_BG = { madeira: '#1c1410', classica: '#14231c', minimal: '#161616' };
function applyLook() {
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name=theme-color]').content = THEME_BG[theme];
  document.querySelectorAll('#look .seg button').forEach(b =>
    b.classList.toggle('on', (b.parentNode.dataset.k === 'view' ? view : theme) === b.dataset.v));
}
function setBusy(msg) {
  const b = $('#busy');
  b.textContent = msg || '';
  b.style.display = msg ? 'block' : 'none';
}

/* ---------- Base de dados (IndexedDB) ---------- */
let db;
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (n, m = 'readonly') => db.transaction(n, m).objectStore(n);
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('biblioteca', 1);
  r.onupgradeneeded = () => {
    r.result.createObjectStore('books', { keyPath: 'id' });
    r.result.createObjectStore('files', { keyPath: 'id' });
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const allBooks = () => rq(store('books').getAll());
const getBook  = id => rq(store('books').get(id));
const putBook  = b  => rq(store('books', 'readwrite').put(b));
const getFile  = id => rq(store('files').get(id));
const putFile  = f  => rq(store('files', 'readwrite').put(f));
const delBook  = id => Promise.all([rq(store('books','readwrite').delete(id)), rq(store('files','readwrite').delete(id))]);

/* ---------- Cores das lombadas ---------- */
const PALETTE = ['122,43,43','43,74,58','42,59,92','92,64,36','74,43,92','70,70,70','128,96,40','34,70,78'];
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
function dominant(src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = 20; c.height = 30;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, 20, 30);
      const d = x.getImageData(0, 0, 20, 30).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {
        const R = d[i], G = d[i+1], B = d[i+2];
        const mx = Math.max(R, G, B), mn = Math.min(R, G, B);
        if (mx > 225 && mx - mn < 25) continue;
        if (mx < 25) continue;
        r += R; g += G; b += B; n++;
      }
      res(n < 30 ? null : [r / n, g / n, b / n]);
    };
    im.onerror = () => res(null);
    im.src = src;
  });
}
function tune([r, g, b]) {
  const l = .299 * r + .587 * g + .114 * b;
  if (l > 150) { const k = 150 / l; r *= k; g *= k; b *= k; }
  else if (l < 40) { const d = 40 - l; r += d; g += d; b += d; }
  return [r, g, b].map(v => Math.round(Math.min(255, v))).join(',');
}
async function fillColors(books) {
  for (const b of books) {
    if (b.color) continue;
    const c = await dominant(b.cover);
    b.color = c ? tune(c) : PALETTE[hash(b.id) % PALETTE.length];
    await putBook(b);
  }
}

/* ---------- Estante ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pctOf = b => Math.round((b.page || 1) / b.pages * 100);

function cardHTML(b) {
  const pct = pctOf(b);
  return `<div class="book" data-id="${b.id}">
    <img class="cover" src="${b.cover}" alt="">
    <button class="more" data-more="${b.id}">⋯</button>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="t">${esc(b.title)}</div>
    <div class="p">${pct}% · pág. ${b.page || 1}/${b.pages}</div>
  </div>`;
}
function rowHTML(b) {
  const pct = pctOf(b);
  return `<div class="row" data-id="${b.id}">
    <img src="${b.cover}" alt="">
    <div class="rt">
      <div class="t">${esc(b.title)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="p">${pct}% · pág. ${b.page || 1}/${b.pages}</div>
    </div>
    <button class="more" data-more="${b.id}">⋯</button>
  </div>`;
}
function spineHTML(b) {
  const p = Math.min(b.pages, 600);
  const h = Math.round(140 + p * 0.12), w = Math.round(26 + p * 0.04);
  const col = b.color || '70,70,70';
  const [r, g, bl] = col.split(',').map(Number);
  const fg = (.299 * r + .587 * g + .114 * bl) > 140 ? '#2a1f18' : '#f4ead8';
  const pct = pctOf(b);
  return `<div class="sp"><button class="spine" data-id="${b.id}"
    style="width:${w}px;height:${h}px;background-color:rgb(${col});color:${fg}">
    <span>${esc(b.title)}</span><b>${pct >= 100 ? '✓' : pct + '%'}</b></button></div>`;
}

async function renderShelf() {
  const all = await allBooks();
  const el = $('#items');
  if (!all.length) {
    el.className = 'items';
    el.innerHTML = '<div class="emptymsg">A estante está vazia.<br>Toca em “+ PDF” para adicionar o primeiro livro.</div>';
    return;
  }
  let books, fn;
  if (view === 'estante') {
    books = all.sort((a, b) => a.title.localeCompare(b.title, 'pt'));
    await fillColors(books);
    fn = spineHTML;
  } else {

async function importPDF(f) {
  const buf = await f.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
  const page = await pdf.getPage(1);
  const base = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: 300 / base.width });
  const c = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  const id = (crypto.randomUUID && crypto.randomUUID()) || Date.now() + '-' + Math.random().toString(36).slice(2);
  await putFile({ id, data: buf });
  await putBook({
    id, title: f.name.replace(/\.pdf$/i, ''), pages: pdf.numPages,
    cover: c.toDataURL('image/jpeg', 0.8), page: 1, addedAt: Date.now()
  });
  pdf.destroy();
}

/* ---------- Tema de leitura ---------- */
const DEF_READ = { t: 'dia', bg: '#14392b', bri: 100, warm: 0 };
let rd = { ...DEF_READ };

const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const lumOf = ([r, g, b]) => {
  const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * f(r) + .7152 * f(g) + .0722 * f(b);
};
const contrast = (a, b) => { const x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
function autoFg(bg) {
  const target = contrast(bg, [255,255,255]) > contrast(bg, [0,0,0]) ? [255,255,255] : [0,0,0];
  let k = .7, fg;
  do { fg = bg.map((v, i) => v + (target[i] - v) * k); k += .05; } while (contrast(fg, bg) < 7 && k <= 1.001);
  return fg;
}
function themeColors() {
  if (rd.t === 'sepia') return { bg: [241,228,200], fg: [59,47,28] };
  if (rd.t === 'noite') return { bg: [23,23,28], fg: [208,201,184] };
  if (rd.t === 'cor') { const bg = hex2rgb(rd.bg); return { bg, fg: autoFg(bg) }; }
  return null;
}
function recolor(canvas) {
  const th = themeColors();
  if (!th) return;
  const ctx = canvas.getContext('2d');
  const im = ctx.getImageData(0, 0, canvas.width, canvas.height), d = im.data;
  const R = new Uint8ClampedArray(256), G = new Uint8ClampedArray(256), B = new Uint8ClampedArray(256);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    R[i] = th.fg[0] + (th.bg[0] - th.fg[0]) * t;
    G[i] = th.fg[1] + (th.bg[1] - th.fg[1]) * t;
    B[i] = th.fg[2] + (th.bg[2] - th.fg[2]) * t;
  }
  for (let i = 0; i < d.length; i += 4) {
    const l = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
    d[i] = R[l]; d[i+1] = G[l]; d[i+2] = B[l];
  }
  ctx.putImageData(im, 0, 0);
}
function loadRead() {
  let g = {};
  try { g = JSON.parse(ls.get('bib.read') || '{}'); } catch (e) {}
  rd = { ...DEF_READ, ...g, ...((cur && cur.read) || {}) };
}
function saveRead() {
  if ($('#rd-book').checked) { cur.read = { ...rd }; putBook(cur); }
  else {
    if (cur.read) { delete cur.read; putBook(cur); }
    ls.set('bib.read', JSON.stringify(rd));

}
function applyRead() {
  const th = themeColors();
  const bgc = th ? rgb2hex(th.bg) : '#ffffff';
  $('#pg').style.background = bgc;
  $('#stage').style.background = th ? bgc : '#111';
  $('#pg').classList.toggle('dark', !!th && lumOf(th.bg) < .25);
  $('#stage').style.filter = (rd.bri < 100 || rd.warm > 0) ? `brightness(${rd.bri / 100}) sepia(${rd.warm / 100})` : 'none';
}
function syncRdUI() {

  $('#rd-colorbox').style.display = rd.t === 'cor' ? 'block' : 'none';

}

let cur = null, pdfDoc = null, pageNum = 1, task = null, seq = 0;

async function openBook(id) {
  const [b, fl] = await Promise.all([getBook(id), getFile(id)]);
  if (!b || !fl) return;
  cur = b;
  pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(fl.data.slice(0)) }).promise;
  pageNum = Math.min(Math.max(b.page || 1, 1), pdfDoc.numPages);
  $('#rtitle').textContent = b.title;
  $('#slider').max = pdfDoc.numPages;
  $('#tl').innerHTML = ''; $('#hl').innerHTML = '';

  show('reader');

}

async function renderPage(keep) {
  const my = ++seq;
  if (task) { try { task.cancel(); } catch (e) {} }
  if (!pdfDoc) return;
  updateUI();
  const page = await pdfDoc.getPage(pageNum);
  if (my !== seq) return;
  const stage = $('#stage');
  const top = keep ? stage.scrollTop : 0;
  const base = page.getViewport({ scale: 1 });
  const cssScale = stage.clientWidth / base.width;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: cssScale * dpr });
  const cvp = page.getViewport({ scale: cssScale });
  const c = $('#canvas'), pg = $('#pg'), tl = $('#tl');
  c.width = vp.width; c.height = vp.height;
  c.style.width = cvp.width + 'px'; c.style.height = cvp.height + 'px';
  pg.style.width = cvp.width + 'px'; pg.style.height = cvp.height + 'px';
  stage.scrollTop = top;
  tl.innerHTML = '';
  drawHighlights();
  const off = document.createElement('canvas');
  off.width = vp.width; off.height = vp.height;
  task = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
  try { await task.promise; } catch (e) { return; }
  if (my !== seq) return;
  recolor(off);
  c.getContext('2d').drawImage(off, 0, 0);
  try {
    const tc = await page.getTextContent();
    if (my !== seq) return;
    tl.style.setProperty('--scale-factor', cvp.scale);
    const t = pdfjsLib.renderTextLayer({ textContentSource: tc, container: tl, viewport: cvp });
    await t.promise;
  } catch (e) {}
}

function updateUI() {
  const n = pdfDoc.numPages;
  $('#rpct').textContent = pageNum + '/' + n + ' · ' + Math.round(pageNum / n * 100) + '%';

function goTo(n) {
  n = Math.min(Math.max(n, 1), pdfDoc.numPages);

  pageNum = n;

let selInfo = null, hideT = null, lastColor = '#ffe14d';

function drawHighlights() {
  const hl = $('#hl');
  hl.innerHTML = '';

  for (const a of cur.ann || []) {
    if (a.page !== pageNum) continue;
    for (const r of a.rects) {

      i.style.cssText = `left:${r[0]*100}%;top:${r[1]*100}%;width:${r[2]*100}%;height:${r[3]*100}%;background:${a.color}`;
      if (a.note) i.dataset.n = '1';
      hl.appendChild(i);
    }
  }
}

function readSelection() {
  const s = getSelection();
  if (!s || s.isCollapsed || !s.rangeCount) return null;
  const rg = s.getRangeAt(0);
  if (!$('#tl').contains(rg.commonAncestorContainer)) return null;
  const box = $('#pg').getBoundingClientRect();
  if (!box.width) return null;
  let rs = [...rg.getClientRects()].filter(q => q.width > 1 && q.height > 1);
  rs = rs.filter((a, i) => !rs.some((b, j) => j !== i &&
    b.left <= a.left + .5 && b.top <= a.top + .5 && b.right >= a.right - .5 && b.bottom >= a.bottom - .5 &&
    (b.width > a.width + .5 || b.height > a.height + .5 || j < i)));
  if (!rs.length) return null;
  const rects = rs.map(q => [
    +((q.left - box.left) / box.width).toFixed(4),
    +((q.top - box.top) / box.height).toFixed(4),
    +(q.width / box.width).toFixed(4),
    +(q.height / box.height).toFixed(4)
  ]);
  const text = s.toString().replace(/\s+/g, ' ').trim();
  return text ? { rects, text } : null;
}

document.addEventListener('selectionchange', () => {
  if (!cur) return;
  const info = readSelection();

/* ---------- Backup ---------- */
async function prepareBackup() {
  const books = await allBooks();
  if (!books.length) { alert('Não há livros para exportar.'); return; }
  setBusy('A preparar o backup…');
  try {
    const parts = [], metas = [];
    let total = 0;
    for (const b of books) {
      const f = await getFile(b.id);
      if (!f) continue;
      metas.push({ ...b, size: f.data.byteLength });
      parts.push(f.data);
      total += f.data.byteLength;
    }
    const enc = new TextEncoder();
    const head = enc.encode(JSON.stringify({ v: 1, date: Date.now(), books: metas }));
    const len = new Uint8Array(4);
    new DataView(len.buffer).setUint32(0, head.length);
    const blob = new Blob([enc.encode('BIB1'), len, head, ...parts], { type: 'application/octet-stream' });
    const name = 'biblioteca-' + new Date().toISOString().slice(0, 10) + '.bib';
    pending = new File([blob], name, { type: 'application/octet-stream' });
    $('#b-exp').textContent = 'Guardar backup (' + Math.max(1, Math.round(total / 1048576)) + ' MB) · toca aqui';
  } catch (err) {
    alert('Erro ao preparar o backup: ' + err.message);
  } finally {
    setBusy('');
  }
}
async function sharePending() {
  const file = pending;
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup da biblioteca' });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    }
  } catch (err) {
    if (err.name !== 'AbortError') alert('Não consegui guardar o backup: ' + err.message);
  }
}
$('#b-exp').onclick = () => pending ? sharePending() : prepareBackup();

  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  setBusy('A importar o backup…');
  try {
    if ((await f.slice(0, 4).text()) !== 'BIB1') throw new Error('o ficheiro não é um backup desta biblioteca');
    const hl = new DataView(await f.slice(4, 8).arrayBuffer()).getUint32(0);
    const head = JSON.parse(await f.slice(8, 8 + hl).text());
    const have = new Set((await allBooks()).map(b => b.id));
    let off = 8 + hl, added = 0, skipped = 0;
    for (const m of head.books) {
      const size = m.size;
      if (have.has(m.id)) { skipped++; off += size; continue; }
      const data = await f.slice(off, off + size).arrayBuffer();
      off += size;
      const book = { ...m }; delete book.size;
      await putFile({ id: book.id, data });
      await putBook(book);
      added++;
    }
    setBusy('');
    alert(added + ' livro(s) importado(s)' + (skipped ? '; ' + skipped + ' já existiam.' : '.'));
    $('#look').classList.remove('on');
    renderShelf();
  } catch (err) {
    setBusy('');
    alert('Não consegui importar: ' + err.message);
  }
};

/* ---------- Arranque ---------- */
function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
}
(async () => {
  applyLook();
  db = await openDB();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  renderShelf();
})();
</script>
